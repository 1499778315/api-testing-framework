name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 API 测试套件
        run: pytest --alluredir=allure-results

      - name: 上传 Allure 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  # ---------------------------------------------------------------------
  # 把可浏览的 Allure 报告发布到 GitHub Pages（仅 push 到 main 时）。
  # ---------------------------------------------------------------------
  publish-report:
    name: 发布 Allure 报告
    needs: api-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 Allure 结果
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: 恢复 Allure 历史记录
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: 生成 Allure 报告（带历史趋势）
        run: |
          npm install -g allure-commandline
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/; fi
          allure generate allure-results -o allure-report --clean

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
